title: "Fengyi Yuan"
name: "Fengyi Yuan"
description: >-
  Fengyi Yuan is an Assistant Professor at The Chinese University of Hong Kong,
  Shenzhen, working on mean field games, generative models, stochastic control,
  financial mathematics, and time-inconsistent decision problems.
url: "https://fy-yuan.github.io"
baseurl: ""
repository: "fy-yuan/fy-yuan.github.io"
locale: "en-US"
timezone: "Asia/Shanghai"

author:
  name: "Fengyi Yuan"

og_image: "/images/og-card.png"

markdown: kramdown
strict_front_matter: true
theme:
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

permalink: pretty
future: false

include:
  - _pages

plugins:
  - jekyll-sitemap

exclude:
  - .bundle
  - .github
  - .gitignore
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - scripts
  - vendor

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "assets"
    values:
      sitemap: false
  - scope:
      path: "images"
    values:
      sitemap: false
