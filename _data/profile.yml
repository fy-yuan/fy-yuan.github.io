bio:
  - >-
    I am an Assistant Professor at the [School of Science and Engineering (SSE)
    of The Chinese University of Hong Kong, Shenzhen](https://sse.cuhk.edu.cn/en).
  - >-
    Previously, I was a Byrne Research Assistant Professor at the [University of
    Michigan, Ann Arbor](https://lsa.umich.edu/math/people/postdoc-faculty/fengyi-yuan.html)
    from 2024 to 2025, working in the group led by [Prof. Erhan
    Bayraktar](https://sites.lsa.umich.edu/erhan/).
  - >-
    I obtained my Ph.D. in math from [Tsinghua University](https://math.tsinghua.edu.cn)
    in June 2024, supervised by [Prof. Zongxia
    Liang](https://math.tsinghua.edu.cn/info/1125/1623.htm).
  - >-
    Feel free to contact me directly if you have any questions about my research
    or teaching. Collaborations on related topics are warmly welcomed!
research_interests:
  - "Mean field games and mean field control problems with rough common noise"
  - "Applications of generative models"
  - "Stochastic control and its applications in financial mathematics"
  - "Time-inconsistency in dynamic decision problems"
