name: Build and deploy GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.4"
          bundler-cache: true
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Verify pinned toolchain
        run: |
          ruby -e 'abort "Expected Ruby 3.3.4, found #{RUBY_VERSION}" unless RUBY_VERSION == "3.3.4"'
          bundle exec ruby -e 'abort "Expected github-pages 232" unless Gem.loaded_specs.fetch("github-pages").version.to_s == "232"'
          bundle exec ruby -e 'abort "Expected Jekyll 3.10.0" unless Gem.loaded_specs.fetch("jekyll").version.to_s == "3.10.0"'
      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}" --trace
      - name: Validate generated site
        run: python3 scripts/validate_site.py _site
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
